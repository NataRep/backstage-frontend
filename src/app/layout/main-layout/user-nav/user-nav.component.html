<div class="menu">
  <div class="button user-icon" (click)="toggle()">
    @if(userName){
    {{userName[0][0]}}{{userName![1][0]}}
    }
  </div>
  @if(isOpen()){
  <nav class="menu__content" [class.open]="isOpen()">
    <ul class="menu__list">
      @for (item of navList; track item.title){
      @if(item.isUserNav){
      <li class="menu__item">
        <a [routerLink]="item.link" routerLinkActive="active" class="menu__item-link" (click)="toggle()">
          <app-icon [name]="item.icon" class="menu__item-icon"></app-icon>
          {{ item.title }}</a>
      </li>
      }
      }
      <li class="menu__item">
        <button class="button button--yellow" (click)="logout()">Logout</button>
      </li>
    </ul>
  </nav>
  }
</div>
