<div class="toast" [class]="'toast--' + type + ' toast--' + position" role="alert" aria-live="polite" aria-atomic="true"
  aria-label="Уведомление" aria-describedby="toast-message">
  <div class="icon">
    <app-icon [name]="type === 'success' ? 'success' : 'warning'"></app-icon>
  </div>
  <div class="toast-content">
    <p id="message">{{ message }}</p>
  </div>
</div>
