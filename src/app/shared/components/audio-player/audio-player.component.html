<audio #audio [src]="meta.url" (loadedmetadata)="setAudioState()" (play)="onPlay()" (pause)="onPause()"
  (timeupdate)="onTimeupdate()" (volumechange)="onVolumeChange()"></audio>
<div class="audioPlayer" [class.active]="audioState.isPlaying">
  <div class="player-wrap">
    <button (click)="togglePlay()">
      @if (audioState.isPlaying) {
      <app-icon name="pause"></app-icon>
      } @else {
      <app-icon name="play"></app-icon>
      }
    </button>
    <div class="bar">
      <input class="progress" type="range" min="0" max="100" [value]="progress" [style.--progress.%]="progress"
        (input)="onSetProgress($event)" />
    </div>
    <div class="duration-wrapper">
      {{ audioState.currentTime | duration }} / {{ audioState.duration | duration }}
    </div>

  </div>
  <button (click)="downloadTrack(meta.url)" class="download" title="Скачать трек">
    <div class="audio-file-info">
      <span class="audio-file-name">{{ meta.name }}</span>
      <span class="audio-file-size">({{ meta.metadata.size | fileSize }})</span>
    </div>
    <app-icon name="download"></app-icon>
  </button>
</div>
