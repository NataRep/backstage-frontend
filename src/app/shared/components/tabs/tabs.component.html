<div class="tabs-container">
  @for (tab of tabs; track tab.label) {
  <a [routerLink]="getTargetLink(tab)" [queryParams]="getTargetQueryParams(tab)"
    [queryParamsHandling]="mode === 'queryParams' ? 'merge' : ''" routerLinkActive="active" class="tab-item"
    [class.tab-item--active]="isTabActive(tab)">
    <app-icon [name]="tab.icon"></app-icon>
    <span class="tab-label">{{ tab.label | upperFirstLetter }}</span>
  </a>
  }
</div>
