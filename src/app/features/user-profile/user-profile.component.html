@let user = currentUser();

<div class="content-container">
  @if(isEditMode){
  <div class="content-container__title">Edit profile</div>
  <button class="button button--yellow" (click)="toggleEditMode()">
    Show
  </button>
  }
  @else{
  <div class="content-container__title">
    <app-icon name="user"></app-icon> Personal info
  </div>
  <div class="content-container__content">
    <app-employer-info [employer]="user"></app-employer-info>
    <div class="row row--buttons">
      <button class="button button--yellow" (click)="toggleEditMode()">
        Edit information
      </button>
      <button class="button button--yellow" (click)="toggleEditMode()">
        Change password
      </button>
    </div>
  </div>
  }
</div>
