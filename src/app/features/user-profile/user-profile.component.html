<div class="content-container">
  @if (isEditMode()) {
  <div class="content-container__title"> <app-icon name="edit"></app-icon> Edit profile</div>
  <app-employee-form [employee]="currentUser()" (save)="updateUser($event)"
    (cancel)="toggleEditMode()"></app-employee-form>
  } @else {
  <div class="content-container__title">
    <app-icon name="user"></app-icon> Personal info
  </div>
  <div class="content-container__content">
    <app-employee-info [employee]="currentUser()" [showLinks]="false"></app-employee-info>
    <div class="row row--buttons">
      <button class="button button--yellow" (click)="toggleEditMode()" [disabled]="!currentUser()">
        Edit information
      </button>
      <button class="button button--yellow" (click)="toggleEditMode()" [disabled]="!currentUser()">
        Change password
      </button>
    </div>
  </div>
  }
</div>

<app-toast [message]="successToastMessage" [type]="'success'" [position]="'top-right'" [isOpen]="isSuccessToastOpen()"
  [autoCloseDuration]="3000">
</app-toast>
<app-toast [message]="errorToastMessage" [type]="'error'" [position]="'top-right'" [isOpen]="isErrorToastOpen()"
  [autoCloseDuration]="4000">
</app-toast>

@if(error()){
{{error()}}

}
