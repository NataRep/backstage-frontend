@if(canEdit()){
<button class="button button--yellow button--add" (click)="openCreateModal()">Add new</button>
}
<app-employees-table mode="active"></app-employees-table>
<app-modal-container [(isOpen)]="isCreateNewModalOpen" type="default" actionButton="Save">
  <div class="modal__header">Create new employee</div>
  <div class="modal__body">
    <app-employee-form #employeeForm [employee]="null" (save)="createNewEmployee($event)"
      (cancel)="closeCreateModal()"></app-employee-form>
  </div>
</app-modal-container>
